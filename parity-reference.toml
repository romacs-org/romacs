# The GNU Emacs reference this project's parity numbers are measured against.
#
# WHY THIS FILE EXISTS (ledger 214).  Every parity number this project
# publishes -- the oracle's expectations, ledger 195's motion sweep, ledger
# 205's below-content audit, the TUI suite -- is a comparison against ONE GNU
# Emacs build.  Until this file existed each harness only checked that *an*
# emacs could be RUN (ledger 210 and 211 made that check honest), and none of
# them checked *which* one.  A reference that VANISHED was caught; a reference
# that CHANGED would have been scored in silence.
#
# WHAT IDENTIFIES THE BUILD. Surviving parity harnesses attest the running
# release version through crates/romacs-parity-reference/src/lib.rs.
# `pin-reference` records these fields when deliberately re-baselining.
# GNU's dump fingerprint identifies the executable/dump pair; the digests bind
# the pair to the deliberately built mirror revision below.
#
# The legacy oracle harness is retired. Its mixed-vintage inline expectations
# are preserved only in reference/gnu-legacy-oracle-corpus.tar.gz; this current
# pin does NOT attest that every archived expectation came from this build.
# See reference/gnu-legacy-oracle-README.md for provenance and source format.
#
# RE-BASELINING.  A rebuild of the GNU mirror is its own change with its own
# re-baselining, never a side effect of a session.  To re-pin, run
#
#     cargo run -p romacs-parity-reference --bin pin-reference -- --emacs PATH --reason "..."
#
# which rewrites the keys below and appends to the log in this comment block.
# Editing the keys by hand defeats the log; the command exists so that the
# record cannot be forgotten.
#
# RE-BASELINING LOG
