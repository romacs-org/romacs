[package]
name = "romacs-display-runtime"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Rust runtime display engine for Romacs"

[dependencies]
# Text rendering - Pure Rust stack
cosmic-text.workspace = true
rustc-hash.workspace = true
fontdb.workspace = true
ttf-parser.workspace = true

# Winit + wgpu backend (always enabled)
winit.workspace = true
wgpu.workspace = true
wgpu-hal.workspace = true
raw-window-handle.workspace = true
arboard.workspace = true
bytemuck.workspace = true
pollster.workspace = true

# Image decoding (async)
image.workspace = true

# SVG rendering (pure Rust, no C deps)
resvg.workspace = true

# Utilities
tracing.workspace = true
tracing-subscriber.workspace = true
serde_json.workspace = true
strum.workspace = true
enumset.workspace = true
enum-map.workspace = true
num_enum.workspace = true
thiserror.workspace = true
bitflags.workspace = true
cfg-if.workspace = true
tempfile.workspace = true

# Thread communication
crossbeam-channel.workspace = true

# FFI / system
libc.workspace = true

romacs-display-protocol.workspace = true
romacs-logo.workspace = true
romacs-video-model.workspace = true
romacs-renderer-wgpu.workspace = true
romacs-scene.workspace = true
kurbo.workspace = true
romacs-video = { workspace = true, optional = true }

[dev-dependencies]
romacs-renderer-wgpu = { workspace = true, features = ["test-gpu"] }
romacs-infra.workspace = true
png.workspace = true

[features]
# Cross-platform native GPU-resident video
video = [
    "dep:romacs-video",
    "romacs-renderer-wgpu/video",
]
[target.'cfg(target_os = "linux")'.dependencies]
smithay-clipboard.workspace = true
x11-dl.workspace = true
rustix = { workspace = true, features = ["time"] }
wayland-backend.workspace = true
wayland-client.workspace = true
wayland-protocols.workspace = true

[lints]
workspace = true
