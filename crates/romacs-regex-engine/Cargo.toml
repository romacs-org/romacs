[package]
name = "romacs-regex-engine"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "GNU Emacs regexp engine (regex-emacs.c translation): compile, backtracker, Pike VM and existence DFA over internal-representation bytes"

# This crate must never depend on an evaluator. The matcher reads text as
# bytes and asks its host about syntax, categories, and case folding through
# traits (`SyntaxLookup`, `CaseTable`) that speak plain Rust types, so no Lisp
# value -- and no handle into a moving heap -- can cross into it. The
# dependency graph, not discipline, enforces that.

[features]
default = []
# Test/diagnostic seams (engine routing overrides, matcher counters, the
# fail-stack probe) for a HOST's unit tests. romacs-core enables this from its
# dev-dependencies, which reproduces the `cfg(test)` these had while the
# engine lived in core. Never enabled by a shipping build.
test-hooks = []
# Typed differential-fuzzing seam, set by romacs-core's `fuzzing` feature.
fuzzing = []

[dependencies]
libc.workspace = true
memchr.workspace = true
num_enum.workspace = true
regex-automata.workspace = true
rustc-hash.workspace = true
smallvec.workspace = true
static_assertions.workspace = true
strum.workspace = true
tracing.workspace = true
unicode-general-category.workspace = true

[dev-dependencies]
tracing-subscriber.workspace = true
