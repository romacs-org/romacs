[package]
name = "romacs-gui-tests"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
publish = false

# This crate exists only for its integration tests and shared GUI test harness.
# It drives Romacs native GUI runs through deterministic text/PNG artifacts
# instead of relying on manual window inspection.

[dependencies]
romacs-infra.workspace = true
image.workspace = true
serde_json = "1"
serde = { workspace = true, features = ["derive"] }

[dev-dependencies]
romacs-renderer-wgpu.workspace = true
winit.workspace = true
wgpu.workspace = true
pollster.workspace = true
strum.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation.workspace = true

[target.'cfg(unix)'.dev-dependencies]
libc.workspace = true

[target.'cfg(target_os = "linux")'.dev-dependencies]
rustix.workspace = true
wayland-client.workspace = true
wayland-protocols-wlr = { version = "0.3.12", features = ["client"] }

[lints]
workspace = true
