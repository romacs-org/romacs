romacs-snapshot = { path = "../romacs-snapshot" }
romacs-layout-input = { path = "../romacs-layout-input" }
romacs-layout = { path = "../romacs-layout" }
romacs-display-protocol.workspace = true
romacs-logo.workspace = true
