[package]
name = "romacs-vm"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
description = "Lexical Elisp reader, register compiler and runtime for romacs"

# Deliberately isolated: no inherited evaluator or workspace build graph.
[dependencies]
romacs-layout-input = { path = "../romacs-layout-input" }
romacs-display-protocol = { path = "../romacs-display-protocol" }
romacs-face = { path = "../romacs-face" }
romacs-regex-engine = { path = "../romacs-regex-engine" }
romacs-snapshot = { path = "../romacs-snapshot" }
romacs-allocator.workspace = true
romacs-logo = { path = "../romacs-logo" }
str_indices = "=0.4.4"
serde_json = "1"
num-bigint = "0.4"
num-integer = "0.1"
stacker.workspace = true
libc.workspace = true
sha2 = "0.11"
# xxh3: the fast content hash of mapped library segments (world::arena).
twox-hash = { version = "2.1", default-features = false, features = ["xxhash3_128", "std"] }
# fns.c secure-hash: MD5 and SHA-1 (SHA-3 is crate::digest).
md-5 = "0.11"
sha1 = "0.11"
# decompress.c zlib-decompress-region: raw DEFLATE under hand-parsed gzip/zlib framing.
flate2.workspace = true
unicode-segmentation = "1.13.2"
# UAX#9 bidi classes for current-bidi-paragraph-direction.
unicode-bidi = "0.3.18"
# Narrow ICU4X casing provider: simple scalar + contextual full-string Unicode.
icu_casemap = "=2.3.0"
icu_locale_core = "=2.3.0"
ropey_stable = { package = "ropey", version = "=1.6.1", default-features = false, features = ["simd"] }
# FxHash for maps keyed by VM-allocated slots and ids; foldhash, seeded per
# map, for maps keyed by names that Lisp, files and the network supply.
rustc-hash = "2"
foldhash = "0.2"
# fzf scoring split across threads over many candidates (src/fzf.rs).
rayon = "1.12"
# SQLite for sqlite.c's primitives, built from the bundled amalgamation.
libsqlite3-sys = { version = "0.38", features = ["bundled"] }
# gnutls.c's TLS client sessions (src/tls.rs), on the ring provider the
# workspace's rustls already builds.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
webpki = { package = "rustls-webpki", version = "0.103", default-features = false, features = ["ring", "std"] }
# The tree-sitter runtime behind treesit.c's primitives (statically linked;
# grammars are dlopened as GNU does).
tree-sitter = "=0.27.0"

[build-dependencies]
sha2 = "0.11"

[features]
# Test-only hooks of the world store (world::store::pause_for_test). Only
# test targets enable it, through the dev-dependency on this crate below.
world-test-hooks = []

[dev-dependencies]
# This crate with its test hooks, for its own tests.
romacs-vm = { path = ".", features = ["world-test-hooks"] }
romacs-coordinate-contract = { path = "../../tests/coordinate-contract" }
# For tests that must drive the REAL producer chain: VM to frame_snapshot to
# layout_frame to display_apply_layout to (window-end). A dev-dependency keeps
# this out of the shipped graph. Without it such a test can only live outside
# the repository, where it rots unrun.
romacs-layout2 = { path = "../romacs-layout2" }
# Compile-fail proofs that the heap boundary is a type property (tests/compile_boundaries.rs).
trybuild = "1.0"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
