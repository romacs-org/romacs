[package]
name = "romacs-webview"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Embedded web content for Romacs"

[features]
default = []
webview = ["dep:bindgen", "dep:glib", "dep:pkg-config", "dep:udev"]

[dependencies]
bitflags.workspace = true
libc.workspace = true
romacs-display-protocol.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
url.workspace = true
winit.workspace = true
glib = { workspace = true, optional = true }
udev = { version = "0.9", optional = true }

[build-dependencies]
bindgen = { workspace = true, optional = true }
pkg-config = { workspace = true, optional = true }

[dev-dependencies]
static_assertions.workspace = true

[lints]
workspace = true
