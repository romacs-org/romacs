[package]
name = "romacs-grammars"
description = "The tree-sitter grammars Romacs ships, at the commits GNU's ts modes pin"
version.workspace = true
edition.workspace = true
license.workspace = true

# Each grammar is the commit its GNU ts mode names in
# `treesit-language-source-alist' (lisp/gnu/), as a crates.io release whose
# sources are that commit's, or the commit itself. etc/tree-sitter/README.md
# records each one's provenance and licence.
[dependencies]
tree-sitter-language.workspace = true
tree-sitter-bash = "=0.23.3"
tree-sitter-c = { git = "https://github.com/tree-sitter/tree-sitter-c", rev = "3aa2995549d5d8b26928e8d3fa2770fd4327414e" }
tree-sitter-cpp = "=0.23.4"
tree-sitter-css = "=0.23.1"
tree-sitter-go = { git = "https://github.com/tree-sitter/tree-sitter-go", rev = "12fe553fdaaa7449f764bc876fd777704d4fb752" }
tree-sitter-html = "=0.23.2"
tree-sitter-javascript = "=0.23.1"
tree-sitter-jsdoc = "=0.23.2"
tree-sitter-json = "=0.24.8"
tree-sitter-md = { git = "https://github.com/tree-sitter-grammars/tree-sitter-markdown", rev = "413285231ce8fa8b11e7074bbe265b48aa7277f9", default-features = false }
tree-sitter-python = "=0.23.6"
tree-sitter-rust = "=0.24.0"
tree-sitter-toml-ng = "=0.7.0"
tree-sitter-typescript = "=0.23.2"
tree-sitter-yaml = "=0.7.0"

[lints]
workspace = true
