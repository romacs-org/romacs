[package]
name = "romacs-mcp"
version = "0.0.20"
edition = "2024"
license = "GPL-3.0-or-later"
description = "Stdio to Unix socket relay for MCP, and the agent session supervisor"

[[bin]]
name = "romacs-mcp"
path = "src/main.rs"

[[bin]]
name = "romacs-agent-host"
path = "src/host.rs"

[dependencies]
serde_json.workspace = true
# The agents' records in SQLite (romacs-agent-host --store), the bundled SQLite
# romacs-vm builds.
rusqlite = { version = "0.40", features = ["bundled"] }

[lints.rust]
unsafe_code = "forbid"
