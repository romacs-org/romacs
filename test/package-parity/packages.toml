# Third-party packages measured against pinned GNU (tools/package-parity).
#
# Each package installs with package-vc from a local mirror of `url` at `rev`,
# after the packages it names in `deps`, into one package directory per editor.
# `lisp_dir` and `main_file` are package-vc's spec keys.  `tests` lists the
# package's own ERT files (globs relative to its checkout), `load` the
# checkout directories its tests add to load-path, and `exclude` globs that
# match support files rather than suites; `setup` names checkout files (test
# helpers) loaded before each test file.  `journey` names a script under journeys/.  `pin` moves
# every `rev` to its upstream default branch.
#
# `ignored_files` is package-vc's :ignored-files.  The pinned package-vc takes
# the union of every file's Package-Requires, so a sibling file that requires
# the package itself makes activation recurse without end, in GNU and Romacs
# alike; each such file is ignored here.

[package.compat]
url = "https://github.com/emacs-compat/compat"
rev = "90880f81419577e1d3f68424d2a3adf31e6d663e"
tests = ["compat-tests.el"]

