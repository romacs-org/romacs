[workspace]
members = [
    "crates/romacs-brand",
    "crates/romacs-snapshot",
    "crates/romacs-vm",
    "crates/romacs-layout-input",
    "crates/romacs-layout",
    "crates/romacs-vm-gui",
    "crates/romacs-grammars",
    "tests/coordinate-contract",
    "crates/romacs-logo",
    "crates/romacs-regex",
    "crates/romacs-mcp",
    "crates/romacs-allocator",
    "crates/romacs-display-protocol",
    "crates/romacs-display-runtime",
    "crates/romacs-face",
    "crates/romacs-font",
    "crates/romacs-font-materializer",
    "crates/romacs-gui-oracle",
    "crates/romacs-gui-tests",
    "crates/romacs-parity-reference",
    "crates/romacs-attach",
    "crates/romacs-imaging",
    "crates/romacs-renderer-wgpu",
    "crates/romacs-scene",
    "crates/romacs-test-fonts",
    "crates/romacs-infra",
    "crates/romacs-video",
    "crates/romacs-video-model",
    "gnu-tests/runner",
]
default-members = [
    "crates/romacs-vm",
    "crates/romacs-vm-gui",
]
resolver = "2"

# Configuration for cross-rs (`cross`), folded in from a root-level
# Cross.toml; cargo itself ignores metadata.* tables.
[workspace.metadata.cross.build.env]
passthrough = ["CARGO_INCREMENTAL"]

[workspace.metadata.cross.target.x86_64-pc-windows-gnu]
image = "ghcr.io/cross-rs/x86_64-pc-windows-gnu:edge"

[workspace.package]
version = "0.0.20"
edition = "2024"
authors = ["Thanos Apollo <public@thanosapollo.org>"]
license = "GPL-3.0-or-later"
repository = "https://git.thanosapollo.org/romacs"

# Lints every package inherits with `[lints] workspace = true`. Every unsafe
# operation inside an `unsafe fn` needs its own `unsafe {}` block, so each
# carries its own SAFETY justification. tools/lib/unsafe_census.py (run by
# tools/check-derived) fails when a package neither denies this nor is
# listed as pending in UNSAFE-FLOORS.json. Clippy's
# undocumented_unsafe_blocks is enforced by that census's SAFETY ratchet, not
# here: existing code would fail it.
[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.dependencies]
# Internal crates
romacs-allocator = { path = "crates/romacs-allocator" }
romacs-display-protocol = { path = "crates/romacs-display-protocol", default-features = false }
romacs-logo = { path = "crates/romacs-logo" }
romacs-face = { path = "crates/romacs-face" }
romacs-font = { path = "crates/romacs-font" }
romacs-font-materializer = { path = "crates/romacs-font-materializer" }
romacs-test-fonts = { path = "crates/romacs-test-fonts" }
romacs-video = { path = "crates/romacs-video", default-features = false }
romacs-video-model = { path = "crates/romacs-video-model" }
romacs-imaging = { path = "crates/romacs-imaging" }
romacs-renderer-wgpu = { path = "crates/romacs-renderer-wgpu", default-features = false }
romacs-scene = { path = "crates/romacs-scene" }
romacs-infra = { path = "crates/romacs-infra" }

# Logging / tracing
tracing = { version = "0.1", features = ["attributes"] }
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "registry"] }
tracing-test = "0.2.6"

# Concurrency & threading
crossbeam-channel = "0.5"
crossbeam-deque = "0.8"

# FFI / system
libc = "0.2"
rustix = { version = "1", features = ["event", "fs"] }

# Crypto
sha2 = "0.11"
getrandom = "0.4"
base64 = "0.22"

# Misc
# Direct dep for the regex-emacs multi-literal SIMD prefilter
# (`util::prefilter::Prefilter` — memchr/Teddy/Aho-Corasick auto-select).
# Only the literal-prefilter machinery is needed, so skip the heavy
# nfa/dfa/meta/syntax layers (feature-unified with `regex`'s copy anyway).
regex-automata = { version = "0.4", default-features = false, features = ["std", "perf-literal"] }
memchr = "2"
rustc-hash = "2"
num_enum = "0.7.6"
enum_dispatch = "0.3.13"
enumset = "1.1.14"
enum-map = "3.1.0"
strum = { version = "0.28", features = ["derive"] }
unicode-script = "0.5"
unicode-general-category = "1.1.0"
stacker = "0.1"
tree-sitter-language = "0.1.7"
fontconfig = "0.11.0"
yeslogic-fontconfig-sys = "6.0.0"
x11-dl = "2.21"
core-foundation = "0.10.1"
serde = { version = "1", features = ["derive", "rc"] }
nutype = { version = "0.8", features = ["serde"] }
serde_json = "1"
toml = "1.1"
thiserror = "2.0"
once_cell = "1.19"
cfg-if = "1.0"
bitflags = { version = "2.0", features = ["serde"] }
bytemuck = { version = "1.18", features = ["derive"] }
memmap2 = "0.9"
image = "0.25"
# Dev-only, `xpm` feature only: an independent XPM3 decoder that
# cross-checks romacs-renderer-wgpu's XPM decoder against the shipped
# etc/images corpus. GNU stays the specification for that decoder (see
# crates/romacs-renderer-wgpu/src/xpm.rs), so this is a smoke check and
# never a runtime dependency; the restricted feature set adds no codecs.
image-extras = { version = "0.1", default-features = false, features = ["xpm"] }
# The renderer decodes PNG rows itself for banded decoding, instead of
# handing the file to `image` and waiting for the whole frame. Same
# version `image` itself builds against, so the tree gains no second copy.
png = "0.18"
# The renderer reads baseline JPEG one MCU row at a time, for the same reason
# and through the same `image_bands` seam as `png` above. It is a direct
# dependency only so this crate can name the reader; `[patch.crates-io]` is
# what points the version at the fork that has one, and it is the same
# `zune-jpeg` `image` builds against, so the tree gains no second copy. Its
# `zune_core` is reached through `zune_jpeg::zune_core`, which is the only way
# to be sure the two are the same types.
zune-jpeg = "0.5"
imagesize = "0.15"
# Tests only: `image` 0.25's `jpeg` feature is decode-only, so the renderer's
# JPEG tests encode their own fixtures — baseline and progressive, at sizes
# either side of `BANDING_MIN_PIXELS`.
jpeg-encoder = "0.7"
allsorts = "0.17.0"

# Compression
flate2 = "1"

# GPU / windowing
# The fork revision and branch are documented in [patch.crates-io].
winit = "=0.31.0-beta.3"
# "glsl" gates ShaderSource::Glsl, which the render thread needs to compile
# composed Shadertoy-dialect surface shaders (shader_surface.rs).
wgpu = { version = "30", features = ["glsl"] }
# Keep this on the same major version as wgpu: the DMA-BUF importer passes
# wgpu-hal types through wgpu's public HAL interop API.
# Its `gpu-allocator` collaborator also exchanges nominal `windows` COM types,
# so a Cargo update must keep the two on compatible Windows binding versions.
wgpu-hal = { version = "30", features = ["vulkan"] }
# Shader-surface WGSL/GLSL validation on the Lisp thread (same version wgpu embeds)
naga = { version = "30", features = ["wgsl-in", "glsl-in"] }
raw-window-handle = "0.6"

wayland-backend = { version = "0.3.15", features = ["client_system", "dlopen"] }
wayland-client = { version = "0.31.14", features = ["system", "dlopen"] }
wayland-protocols = { version = "0.32.12", features = ["client", "staging"] }
ash = "0.38"
pollster = "1.0"
resvg = "0.47"
# 2D geometry (already linked by usvg) and path tessellation for scenes.
kurbo = "0.13.1"
lyon = "1.0.16"
# Flex layout of scene groups (crates/romacs-scene).
taffy = { version = "0.13", default-features = false, features = ["std", "taffy_tree", "flexbox"] }
# Same version resvg 0.47 links, so COLR paint graphs rasterize with the
# rasterizer already in the tree rather than a second copy of it.
tiny-skia = "0.12"
svgtypes = "0.16.1"
simplecss = "0.2.2"
cosmic-text = "0.18.2"
# >=0.2.9 required: 0.2.7 rebuilt the TrueType hinting instance for every
# rasterized glyph (dfrg/swash#114 -- default-weight variation coords made the
# hinting-cache key never match, ~7.7% of our redisplay CPU); 0.2.8 fixed that
# but regressed to wrong-size glyphs after cache eviction (dfrg/swash#120);
# 0.2.9 has both fixes.
swash = "0.2.9"
fontdb = "0.23"
ttf-parser = "0.25"
arboard = "3.4"
smithay-clipboard = "0.7.3"

# GStreamer (video)
gstreamer = "0.25"
gstreamer-video = "0.25"
gstreamer-app = "0.25"
gstreamer-allocators = "0.25"
gstreamer-pbutils = "0.25"

smallvec = "1.13"
static_assertions = "1.1"

# Dev / test
proptest = "1.6"
tempfile = "3.27.0"

[profile.release]
lto = true
codegen-units = 1
debug = false
# macOS 27's linker emits malformed proc-macro dylibs when Cargo strips their
# debuginfo, which surfaces later as E0463 while loading crates such as strum.
# Keep release artifacts loadable; debug=false still avoids embedding debug info
# in the first place.
strip = "none"

[profile.stage]
inherits = "release"
lto = "off"
codegen-units = 256
incremental = true

# Keep workspace crates fast to compile and easy to debug, while building their
# third-party dependencies with release-like code generation. Cargo package
# overrides cannot set `lto`, `panic`, or `rpath`, so those continue to inherit
# from the dev profile.
# Workspace members: keep what a panic needs, drop what the linker copies.
# Cargo's default dev profile is full DWARF, and it was 61% of every 245 MB
# test binary -- relinked into each of the crate's integration targets.
# `line-tables-only` keeps file:line in backtraces (the test suites read them)
# and `unpacked` leaves the remainder beside the binary instead of inside it.
[profile.dev]
debug = "line-tables-only"
split-debuginfo = "unpacked"

[profile.dev.package."*"]
opt-level = 3
debug = false
strip = "none"
debug-assertions = false
overflow-checks = false
codegen-units = 16
incremental = false

# Apply the same policy to workspace build scripts, proc macros, and their
# dependencies. Non-workspace build dependencies already match the package
# wildcard above; this also covers build targets owned by workspace members.
[profile.dev.build-override]
opt-level = 3
debug = false
strip = "none"
debug-assertions = false
overflow-checks = false
codegen-units = 16
incremental = false

# Cargo's default `lto = false` still runs crate-local ThinLTO when code is
# optimized, which made a warm one-line romacs-core edit -> `cargo test` take
# 109 s (83 s in LLVM ThinLTO) instead of 35 s. Tests never need it.
[profile.test]
lto = "off"

# The GUI oracle correlates every inked cell with ~1,500 glyph templates at
# 25 offsets; unoptimised, its suite takes minutes instead of seconds.
[profile.test.package.romacs-gui-oracle]
opt-level = 3

[profile.dev.package.romacs-gui-oracle]
opt-level = 3

# Optimized build driven by a PGO profile. Same codegen settings as release,
# but cargo gives it its own target/release-pgo directory, so a PGO build never
# replaces an ordinary release binary (or invalidates its pdump fingerprint).
# The profile data itself is supplied by RUSTFLAGS (-Cprofile-use=FILE).
[profile.release-pgo]
inherits = "release"
lto = true
codegen-units = 1

# PGO build that keeps its symbols, for profiling the configuration actually
# shipped: PGO changes inlining and block layout, so hotspots measured on a
# plain release build do not necessarily hold for release-pgo.
[profile.release-pgo-profiling]
inherits = "release-pgo"
debug = true
strip = "none"

# Instrumented pass of a PGO build. Separate from release-pgo so the
# counter-collecting binary (which is slow, and useless afterwards) never
# occupies the directory the optimized one lands in.
[profile.release-pgo-gen]
inherits = "release"
lto = true
codegen-units = 1
# NOT for release builds. The v0.0.18 attempt to ship this profile failed on two
# of five targets: fat LTO together with `-Cprofile-generate` crashed rustc with
# STATUS_ACCESS_VIOLATION compiling `yoke` for aarch64-pc-windows-msvc, and the
# Linux x86_64 runner was SIGTERMed during the instrumented links. Releases
# build `release` (see .github/workflows/release.yml). Anyone reviving this for
# release should try `lto = false` here first -- the instrumented binary is
# discarded after training, so LTO buys it nothing.

# Test gate: release code generation (opt-level 3, no debug assertions) without
# the link-time work that only shipped binaries need. Fat LTO with one codegen
# unit made each romacs-core test binary a 30+ minute single-threaded build;
# here codegen spreads over every job and an edit rebuilds incrementally.
# Used by tools/gate; never for shipped artifacts.
[profile.gate]
inherits = "release"
lto = "off"
codegen-units = 256
incremental = true

# Cheap correctness feedback only; tools/dev-loop selects a bounded subset.
# Compute-heavy parity/ratchet/performance and GUI suites stay on profile.gate.
[profile.dev-fast]
inherits = "test"
opt-level = 0
lto = "off"
codegen-units = 256
incremental = true

[profile.profiling]
inherits = "release"
debug = true
strip = "none"

[patch.crates-io]
# Fork branch: patch (includes inherited fixes and explicit Wayland connections
# with failed-construction retry; deferred daemon startup never mutates display env).
winit = { git = "https://github.com/thanosapollo/winit", rev = "6884804b87b93c228b97ba683ddcc7d0acb4d023" }
# Fork branch: neomacs-present-timing.
# Native presentation IDs/timestamps; see the Vulkan timing seam in this fork.
wgpu-hal = { git = "https://github.com/eval-exec/wgpu", rev = "9717f9fe277beec2c98df550662a626f8fc0248c" }
# Fork branch: patch (based on neomacs-variable-weight-match).
# Scoped font-cache insertion is maintained in the cosmic-text fork.
cosmic-text = { git = "https://github.com/eval-exec/cosmic-text", rev = "5951ae9b0a4c794e594c56f596ba04e5f57416a1" }
# Fork branch: fix/bundled-zlib-include.
freetype-sys = { git = "https://github.com/eval-exec/freetype-sys", rev = "a4eb0a7cf08d9b503bda7d7261c97f8973d34bf1" }
# Fork branch: patch (based on the 0.5.15 release revision, 31d81fed).
# Row-wise baseline JPEG: `McuRowReader` hands back one MCU row at a time, and
# `is_progressive` is public so a progressive image can be routed to the
# whole-image path instead. See `image_bands`'s JPEG arm. Both crates are
# listed because the fork is a workspace and `zune-jpeg` reaches `zune-core` by
# path, so patching only the decoder leaves `image` -- which names `zune-core`
# itself -- holding a second copy whose `ZCursor` is a different type. That
# revision's `crates/zune-jpeg` and `crates/zune-core` are otherwise identical
# to the registry's `zune-jpeg` 0.5.15 and `zune-core` 0.5.1.
zune-jpeg = { git = "https://github.com/eval-exec/zune-image", rev = "39dd805e32d74b2092405b5da0bec86747f04e34" }
zune-core = { git = "https://github.com/eval-exec/zune-image", rev = "39dd805e32d74b2092405b5da0bec86747f04e34" }
