[package]
name = "romacs-retired-vm-contract"
version = "0.1.0"
edition = "2024"
publish = false

[dev-dependencies]
romacs-vm = { path = "../../crates/romacs-vm" }

# Declared, not only auto-discovered: crane's dependency-only build (nix/
# package.nix) stubs declared targets and drops undeclared ones, and a package
# left with no target makes the whole workspace fail to load there.
[[test]]
name = "session"
